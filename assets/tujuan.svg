<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" role="img" aria-labelledby="title desc"><title id="title">Tujuan utuh</title><desc id="desc">Arah pendidikan diterjemahkan ke beberapa pengalaman yang saling mendukung, tidak direduksi menjadi satu skor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#205b48"/></marker></defs><rect width="480" height="430" rx="22" fill="#fffef9"/><path d="M240,212 L240,63" stroke="#8ea695" stroke-width="3"/><path d="M240,212 L365,212" stroke="#8ea695" stroke-width="3"/><path d="M240,212 L240,362" stroke="#8ea695" stroke-width="3"/><path d="M240,212 L115,212" stroke="#8ea695" stroke-width="3"/><circle cx="240" cy="212" r="72" fill="#205b48"/><text x="240" y="212.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" fill="white">Tujuan utuh</text><rect x="130.0" y="29.0" width="220" height="68" rx="20" fill="#e7f0df" stroke="#c0cec1"/><text x="240" y="63.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" fill="#193e36">Bahasa &amp; pikir</text><rect x="334.0" y="167.0" width="140" height="90" rx="20" fill="#faebd8" stroke="#c0cec1"/><text x="404" y="212.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" fill="#193e36">Kemandirian</text><rect x="130.0" y="328.0" width="220" height="68" rx="20" fill="#f4f0d5" stroke="#c0cec1"/><text x="240" y="362.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" fill="#193e36">Relasi &amp; emosi</text><rect x="6.0" y="167.0" width="140" height="90" rx="20" fill="#e4efee" stroke="#c0cec1"/><text x="76" y="212.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" fill="#193e36">Nilai &amp; adab</text></svg>